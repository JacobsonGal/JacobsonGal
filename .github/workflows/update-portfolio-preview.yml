name: Update portfolio preview

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated]

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Save preview images
        run: |
          mkdir -p assets
          npx playwright screenshot https://jacobsongal.github.io/ assets/portfolio-preview.png \
            --viewport-size=1600,1000 \
            --color-scheme=light \
            --wait-for-timeout=4000
          npx playwright screenshot https://jacobsongal.github.io/ assets/portfolio-preview-dark.png \
            --viewport-size=1600,1000 \
            --color-scheme=dark \
            --wait-for-timeout=4000

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-preview.png assets/portfolio-preview-dark.png
          if git diff --staged --quiet; then
            echo "Portfolio preview unchanged"
          else
            git commit -m "Update portfolio preview screenshot"
            git push
          fi
