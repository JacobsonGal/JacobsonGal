name: Update portfolio preview

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated]

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture jacobsongal.github.io
        uses: browser-actions/setup-playwright@v1

      - name: Save preview image
        run: |
          mkdir -p assets
          npx playwright screenshot https://jacobsongal.github.io/ assets/portfolio-preview.png \
            --viewport-size=1280,720 \
            --wait-for-timeout=4000

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-preview.png
          if git diff --staged --quiet; then
            echo "Portfolio preview unchanged"
          else
            git commit -m "Update portfolio preview screenshot"
            git push
          fi
